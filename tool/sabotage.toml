[[sabotage]]
# And the decision itself, with the wiring left intact. This is the half a
# check on the caller cannot see: cursor_shape() is consulted on every
# frame and answers Bar for everything, so the accessor, the reset and the
# call are all correct and the caret never changes. QPlainTextEdit is the

# REMOVED: "a deleted overlay stays in the registry".
#
# The breakage is FATAL, so the check it named could not report it. Taking
# `registry().removeAll(this)` out of ~Overlay() leaves a dangling pointer
# in a registry the compositor walks every frame, and the suite segfaults
# in a paint path BEFORE reaching the check -- measured, `qtty-tests
# graphics` alone dies with 0 failures printed. The harness calls that
# INCONCLUSIVE and is right to: a crash is not a check speaking.
#
# It reported FAIL by hand when the check was written (8.44); the suite has
# grown since, and something now touches the registry first. What defends
# the property instead: the check itself, which passes on the real code and
# asserts the registry is emptied, and the sanitizer configuration, where a
# dangling registry entry is a use-after-free rather than a lucky crash.


[[sabotage]]
# The clause a reimplementation of Qt's rule is likeliest to drop, and it
# is silent when dropped: every single-placeholder title still resolves
# correctly, and only a DOUBLED one -- an application writing a literal
# "[*]" -- comes out wrong.
name = "a doubled placeholder does not collapse to a literal"
file = "src/runtime/title_keeper.h"
find = "\t\tcap.replace(QStringLiteral(\"[*][*]\"), mark);"
into = "\t\t;"
count = 1
check = "a doubled placeholder is one literal [*] and takes no asterisk"

[[sabotage]]
# The other half of the same rule: Qt spends a placeholder only where the
# RUN of consecutive "[*]" is odd. Counting the run is what an
# implementation that merely searched for "[*]" would leave out, and the
# run of three is where the two answers part company.
name = "the run of consecutive placeholders is never counted"
file = "src/runtime/title_keeper.h"
find = "\t\t\twhile (cap.indexOf(mark, index) == index) {"
into = "\t\t\twhile (false) {"
count = 1
check = "a run of three spends its last one and collapses the pair"


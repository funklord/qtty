[[sabotage]]
# Not "revert the gate", which would make it pass VACUOUSLY -- and a
# vacuous pass is a PASS, which this harness looks past. The sabotage is
# the positive control instead: make the library non-inert and require the
# gate to notice. Under the old class-name spelling it did not.

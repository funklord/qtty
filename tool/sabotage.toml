file = "src/grid/grid_style.cpp"
find = "\t\t\treturn QRect(rtl ? r.left() + cw : r.right() + 1 - 2 * cw,"
into = "\t\t\treturn QRect(r.right() + 1 - 2 * cw,"
count = 1
check = "a right-to-left combo box's arrow is drawn in the cell its hit test names"

[[sabotage]]
# The mark rule removed, so a shape inside a cell goes back to having
# its edges rounded -- every bullet one row below its own text and the
# last one under the list. 8.305.
name = "a mark is placed by its edges rather than by where it sits"
file = "src/render/cell_paint.cpp"
find = "\tif (m.width() < cw && m.height() < ch)\n\t\treturn QRect(int(std::floor(m.center().x() / cw)),\n\t\t             int(std::floor(m.center().y() / ch)), 1, 1);"
into = ""
count = 1
check = "a mark inside a row lands in that row"

[[sabotage]]
# The mark rule widened to either dimension, which swallows a caret --
# 1x19 is narrower than a cell and a whole row tall, and placing it by
# its centre moves it off the boundary it belongs on. 8.305.
name = "the mark rule swallows a caret"
file = "src/render/cell_paint.cpp"
find = "\tif (m.width() < cw && m.height() < ch)"
into = "\tif (m.width() < cw || m.height() < ch)"
count = 1
check = "a caret a whole row tall and a rule many cells wide still round"

[[sabotage]]
# mouse_press setting `release` instead, which is the mistake a helper
# built by hand makes and which nothing could have caught while no
# caller existed: a drag with no press behind it moves nothing. 8.307.
name = "the press helper releases instead of pressing"
file = "include/qtty/testing.h"
find = "inline void mouse_press(InputRouter &router, const QPoint &cell,\n                        int button = 1) {\n\tMouseEvent e;\n\te.cell = cell;\n\te.button = button;\n\te.press = true;"
into = "inline void mouse_press(InputRouter &router, const QPoint &cell,\n                        int button = 1) {\n\tMouseEvent e;\n\te.cell = cell;\n\te.button = button;\n\te.release = true;"
count = 1
check = "a press, a move and a release drag a scroll bar's thumb"

# The terminal-lost path made conditional again, which is the state
# the seam exists to prevent: it used to arrive as a synthesised
# Ctrl+D through the quit-key loop, so anything taking that chord away
# took the stop with it. The check fails red rather than hanging,
# because its fixture carries a five-second safety net. 8.308.
[[sabotage]]
name = "a terminal that goes away no longer stops the program"
file = "src/runtime/input_router.cpp"
find = "void InputRouter::on_terminal_lost() {\n\tif (qApp) qApp->quit();\n}"
into = "void InputRouter::on_terminal_lost() {\n}"
count = 1
check = "a terminal that goes away stops the program"

[[sabotage]]
name = "an item's inline editor takes the whole item rectangle"
file = "src/grid/grid_style.cpp"
find = "\tif (se == SE_ItemViewItemText && opt) {"
into = "\tif (false && se == SE_ItemViewItemText && opt) {"
count = 1
check = "an inline editor opens where the item's own text was"

[[sabotage]]
name = "a branch mark does not turn over when the folder opens"
file = "src/grid/grid_style.cpp"
find = "(opt->state & State_Open) ? QStringLiteral("
into = "(false) ? QStringLiteral("
count = 1
check = "Right opens it and the mark turns over with it"

[[sabotage]]
name = "an unknown-length progress bar animates after all"
file = "src/grid/grid_style.cpp"
find = "\t\t\t\tconst bool unknown = span <= 0;"
into = "\t\t\t\tconst bool unknown = span <= 0 && QTime::currentTime().msec() % 2;"
count = 1
check = "a busy progress bar costs an idle session nothing on the wire"

[[sabotage]]
name = "no control is ever reported as missing a letter"
file = "src/runtime/input_router.cpp"
find = "\t\tif (!c.letter.isNull()) continue;"
into = "\t\tif (true) continue;"
count = 1
check = "a button with no letter is named"

[[sabotage]]
name = "the two letter reports overlap instead of partitioning"
file = "src/runtime/input_router.cpp"
find = "\t\t\tif (unreachable.contains(w)) continue;"
into = "\t\t\tif (false && unreachable.contains(w)) continue;"
count = 1
check = "a control nothing reaches at all is one report's finding and not both"

[[sabotage]]
name = "a wizard's Cancel is not taken to be reached by Escape"
file = "src/runtime/input_router.cpp"
find = "\tfor (QWizard *w : wizards)\n\t\tkeyed.insert(w->button(QWizard::CancelButton));"
into = "\tfor (QWizard *w : wizards)\n\t\t(void)w;"
count = 1
check = "Qt's own wizard reports none"

[[sabotage]]
name = "Ctrl+Space is left out of the ambiguous family"
file = "src/runtime/input_router.cpp"
find = "\t\t\t\t      || key == Qt::Key_J || key == Qt::Key_Space;"
into = "\t\t\t\t      || key == Qt::Key_J;"
count = 1
check = "and Ctrl+Space, whose byte is the 0x00 Ctrl+@ makes"

[[sabotage]]
name = "a space arrives as text with no key code"
file = "src/backend/ansi/ansi_backend.cpp"
find = "\telse if (c == ' ') { k.qt_key = Qt::Key_Space; k.text = QStringLiteral(\" \"); }"
into = "\telse if (c == ' ') { k.qt_key = 0; k.text = QStringLiteral(\" \"); }"
count = 1
check = "a space byte carries Qt::Key_Space as well as its text"

[[sabotage]]
name = "a key row is reworded here and not on the page"
file = "test/suite_router.cpp"
find = "\t\t\t{ \"`Ctrl+Z`\",                                      13 },"
into = "\t\t\t{ \"`Ctrl+Z` (undo)\",                               13 },"
count = 1
check = "the rows the page promises are the rows this check drives"

[[sabotage]]
name = "a rubber band covers what it is selecting"
file = "src/grid/grid_style.cpp"
find = "\t\t\t\t\tCell v = dev->buffer().at(x, y);"
into = "\t\t\t\t\tCell v = dev->buffer().at(x, y); v.ch = QStringLiteral(\" \");"
count = 1
check = "a rubber band over four rows leaves every glyph under it"

[[sabotage]]
name = "a rubber band sets its mark instead of toggling it"
file = "src/grid/grid_style.cpp"
find = "\t\t\t\t\tv.attrs ^= Attrs(Attr::Reverse);"
into = "\t\t\t\t\tv.attrs |= Attrs(Attr::Reverse);"
count = 1
check = "a band over a row that is already selected still shows"

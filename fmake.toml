[project]
# The tests read snapshot fixtures out of the repository, so they have to
# be told where it is. qmake spells it $$QTTY_ROOT, which is $$PWD from
# qtty.pri; a relative path cannot serve, because a test binary does not
# run from a fixed directory.
defines = ['QTTY_SOURCE_DIR="$root"']

# The language standard, which qtty.pri states as `CONFIG += c++17` and this
# file did not state at all. fmake passes no -std= when none is given, so the
# fmake build took whatever the compiler defaults to -- measured with
# `fmake -n`: not one -std= flag on any command line. It agreed with qmake
# only because g++ currently defaults to gnu++17, which is a property of the
# compiler rather than of this project, and it would drift the day that
# default moves without anything failing. tools-check compares the two.
std = "c++17"

# The suite includes the example's header -- test/suite_router.cpp says
# `#include "chat.h"` -- because the example's delegate is a thing the
# suite tests rather than a thing it merely links. qmake is told where
# that is by test/test.pro's `INCLUDEPATH += $$QTTY_ROOT/example/chat`,
# and fmake cannot read a .pro, so it has to be said again here.
#
# Measured before it was written: `python3 ~/src/fmake/fmake -j4` over a
# `git archive HEAD` extraction exits 1 with
#
#     * chat.h: No such file or directory
#       in test/suite_router.cpp
#       chat.h is on no include path here
#
# which is the fourth instance of this file's standing theme -- a fact
# qmake states in a .pro and fmake has no way to discover. tools-check
# now compares this one too, so the two cannot drift apart again in
# silence, which is how the tray target's name got missed.
include-dirs = ["example/chat"]

# spike/ is the Phase 0 record -- the four spikes exactly as they were run,
# which is what makes them evidence for design.md's measurements. Nothing
# in the library builds them, and .style-gate.toml already exempts them for
# the same reason.
exclude = ["spike", "build-*"]

# The tools ship with a qtty- prefix; fmake names a program after its root
# TU, which gives the bare verb. tool/inspect/*.pro and its siblings are
# the authority. example/chat keeps its own name, which already matches.
[target.inspect]
name = "qtty-inspect"

[target.replay]
name = "qtty-replay"

[target.negotiate]
name = "qtty-negotiate"
install = false

# The tray gate, added after the three above and missed here at the time --
# so fmake built it as the bare verb `tray` while qmake built
# `qtty-tray-check`, and the binary that appeared at the root was one
# .gitignore did not know either. tool/tray/tray.pro is the authority.
[target.tray]
name = "qtty-tray-check"
install = false

# WHAT `make install` INSTALLS IS TWO PROGRAMS, and fmake's plan had six.
# `install -m 0755 $(INSPECT) $(REPLAY)` is the authority, and test-install
# pins it from both ends. The other four are a gate that needs a session
# bus, a probe for measuring this machine's terminal, an example, and a
# negotiator that reports rather than does -- none of them a thing to put
# in somebody's $PREFIX/bin.
#
# It cost nothing while nobody ran `fmake --install` here, and it is
# written down rather than left because an ejected Makefile carries the
# install rule with it: `--eject make` from this tree would have shipped
# all six. fmake's own `--explain` says which of the two ways declined a
# target, so the absence does not read as fmake having forgotten.
# chat is ALSO declined by fmake's own directory rule now -- an
# `example/` directory infers it, fmake's section 300 -- so this key is
# redundant to fmake and is kept anyway, for two reasons. An explicit
# statement beats an inferred one and survives a tree being reorganised;
# and tools-check's static half asserts from THIS side, that a program
# make install does not ship says so here, so removing the key would fail
# that gate while fmake's own plan stayed right. `@install yes` is the
# override if qtty ever ships an example.
[target.chat]
install = false

[target.screen-probe]
install = false
